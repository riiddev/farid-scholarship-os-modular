name: Update Farid Scholarship OS from uploaded ZIP

on:
  push:
    branches:
      - main
    paths:
      - "update/part*.b64"

permissions:
  contents: write

jobs:
  update-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reassemble and extract update archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/farid-update"
          cat update/part1.b64 update/part2.b64 update/part3.b64 update/part4.b64 update/part5.b64 update/part6.b64 > "$RUNNER_TEMP/source.zip.b64"
          base64 --decode "$RUNNER_TEMP/source.zip.b64" > "$RUNNER_TEMP/source.zip"
          unzip -tq "$RUNNER_TEMP/source.zip"
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/farid-update"
          test -s "$RUNNER_TEMP/farid-update/farid-scholarship-os/index.html"
          cp -a "$RUNNER_TEMP/farid-update/farid-scholarship-os/." .
          rm -rf update

      - name: Commit updated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: update Farid Scholarship OS from latest source"
          git push
