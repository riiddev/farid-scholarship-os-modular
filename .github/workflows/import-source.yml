name: Import Farid Scholarship OS source

on:
  push:
    branches:
      - main
    paths:
      - "archive/part1.bin"
      - "archive/part2.b64"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reassemble and extract original source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/farid-source"
          cat archive/part1.bin > "$RUNNER_TEMP/farid-source/project.tar.xz"
          base64 --decode archive/part2.b64 >> "$RUNNER_TEMP/farid-source/project.tar.xz"
          xz -t "$RUNNER_TEMP/farid-source/project.tar.xz"
          tar -xJf "$RUNNER_TEMP/farid-source/project.tar.xz" -C "$RUNNER_TEMP/farid-source"
          test -f "$RUNNER_TEMP/farid-source/farid-scholarship-os/index.html"
          cp -a "$RUNNER_TEMP/farid-scholarship-os/." .
          rm -f archive/part1.bin archive/part2.b64

      - name: Commit extracted project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: import Farid Scholarship OS source files"
          git push
