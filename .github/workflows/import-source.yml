name: Import Farid Scholarship OS source

on:
  push:
    branches:
      - main
    paths:
      - "archive/source.zip"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract original project archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/farid-source"
          unzip -q archive/source.zip -d "$RUNNER_TEMP/farid-source"
          test -f "$RUNNER_TEMP/farid-source/farid-scholarship-os/index.html"
          cp -a "$RUNNER_TEMP/farid-source/farid-scholarship-os/." .
          rm -f archive/source.zip

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: import Farid Scholarship OS source files"
          git push
